name: YouTube no-cookie diagnostic
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/youtube-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install yt-dlp and token provider
        run: python -m pip install 'yt-dlp[default]' 'bgutil-ytdlp-pot-provider==2.0.2'
      - name: Start token provider
        run: docker run -d --init --name pot-provider -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider:2.0.2
      - name: Probe YouTube metadata without cookies
        run: |
          python -m yt_dlp -v --js-runtimes node --extractor-args 'youtube:player_client=mweb,tv,web_safari' --skip-download --print '%(id)s %(title)s' 'https://www.youtube.com/watch?v=SbQevYd1-oc'
      - name: Download a short test segment
        run: |
          python -m yt_dlp -v --js-runtimes node --extractor-args 'youtube:player_client=mweb,tv,web_safari' --download-sections '*0-10' --no-playlist -o /tmp/youtube-test.\'%(ext)s\' 'https://www.youtube.com/watch?v=SbQevYd1-oc'
      - name: Provider logs
        if: always()
        run: docker logs pot-provider || true
